<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WORK WITH MUSIC — ARKESTA ECOSYSTEM</title>
  
  <!-- FAVICON & APPLE TOUCH ICONS -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23080504'/><circle cx='256' cy='256' r='210' fill='none' stroke='%23f59e0b' stroke-width='24'/><circle cx='256' cy='256' r='140' fill='none' stroke='%23ea580c' stroke-width='16'/><circle cx='256' cy='256' r='70' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='220' font-family='sans-serif' font-weight='bold' fill='%23080504'>A</text></svg>">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23080504'/><circle cx='256' cy='256' r='210' fill='none' stroke='%23f59e0b' stroke-width='24'/><circle cx='256' cy='256' r='140' fill='none' stroke='%23ea580c' stroke-width='16'/><circle cx='256' cy='256' r='70' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='220' font-family='sans-serif' font-weight='bold' fill='%23080504'>A</text></svg>">
  <link rel="apple-touch-icon" sizes="180x180" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='120' fill='%23080504'/><circle cx='256' cy='256' r='210' fill='none' stroke='%23f59e0b' stroke-width='24'/><circle cx='256' cy='256' r='140' fill='none' stroke='%23ea580c' stroke-width='16'/><circle cx='256' cy='256' r='70' fill='%23f59e0b'/><text x='50%' y='55%' dominant-baseline='middle' text-anchor='middle' font-size='220' font-family='sans-serif' font-weight='bold' fill='%23080504'>A</text></svg>">

  <!-- PWA Meta Tags -->
  <meta name="theme-color" content="#080504">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ARKESTA">
  <meta name="description" content="A simple music ecosystem for Bhojpuri, Hindi, and Punjabi listening sessions while working.">

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Tiro+Devanagari+Hindi:ital@0;1&family=Space+Mono:wght@400;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* ==========================================================================
       RESET & BASE DESIGN SYSTEM
       ========================================================================== */
    :root {
      --bg-dark: #080504;
      --accent-amber: #f59e0b;
      --accent-orange: #ea580c;
      --text-main: #f9fafb;
      --text-muted: rgba(255, 255, 255, 0.65);
      --glass-bg: rgba(16, 10, 7, 0.88);
      --glass-border: rgba(255, 255, 255, 0.12);
      --player-height: 120px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
    }

    /* WEATHER PARTICLES CANVAS OVERLAY */
    #weather-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    /* CINEMATIC FULLSCREEN BACKGROUND */
    .fixed-bg-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -2;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      transition: background-image 0.8s ease-in-out;
    }

    .fixed-bg-overlay {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: -1;
      background: 
        radial-gradient(circle at 50% 30%, rgba(245, 158, 11, 0.12) 0%, transparent 60%),
        linear-gradient(180deg, rgba(8, 5, 4, 0.65) 0%, rgba(8, 5, 4, 0.85) 60%, rgba(8, 5, 4, 0.98) 100%);
      pointer-events: none;
    }

    /* SINGLE VIEWPORT CONTAINER */
    .app-viewport {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: clamp(16px, 2.5vw, 28px);
      padding-bottom: calc(var(--player-height) + 24px + env(safe-area-inset-bottom, 0px));
    }

    /* ==========================================================================
       TOP BAR (BALANCED PADDINGS & PERFECTLY CENTERED CATEGORY SWITCHER)
       ========================================================================== */
    .top-bar {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      z-index: 20;
      position: relative;
    }

    /* LEFT CLUSTER */
    .top-left-cluster {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 4px;
      flex-shrink: 0;
    }

    .clock-time {
      font-size: clamp(1rem, 2vw, 1.25rem);
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }

    .clock-date {
      font-family: 'Space Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .live-counter-row {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background-color: #10b981;
      box-shadow: 0 0 8px #10b981;
    }

    .weather-switcher {
      display: flex;
      align-items: center;
      gap: 2px;
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 4px;
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      margin-top: 4px;
    }

    .weather-btn {
      background: transparent;
      border: none;
      font-size: 0.78rem;
      padding: 2px 6px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
      opacity: 0.55;
    }

    .weather-btn:hover, .weather-btn.active {
      opacity: 1;
      background: rgba(255, 255, 255, 0.15);
    }

    /* CENTER CATEGORIES (MATHEMATICALLY CENTERED IN TOP BAR) */
    .top-center-categories {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      top: 0;
      z-index: 25;
    }

    .category-switcher {
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(255, 255, 255, 0.06);
      padding: 4px;
      border-radius: 24px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    .cat-btn {
      background: transparent;
      border: none;
      color: rgba(255, 255, 255, 0.65);
      padding: 6px 14px;
      border-radius: 18px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
    }

    .cat-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
    }

    .cat-btn.active {
      background: var(--accent-amber);
      color: #080504;
      font-weight: 700;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.35);
    }

    /* RIGHT UTILITIES & PILLS (PLAYLISTS, ALL SONGS, INSTALL) */
    .top-right-utilities {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .top-pill-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.78rem;
      font-weight: 600;
      cursor: pointer;
      backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .top-pill-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.25);
    }

    .install-btn {
      display: none; /* Dynamic PWA trigger */
      background: rgba(245, 158, 11, 0.15);
      border-color: rgba(245, 158, 11, 0.35);
      color: var(--accent-amber);
    }

    .install-btn:hover {
      background: var(--accent-amber);
      color: #080504;
    }

    /* ==========================================================================
       CENTER HERO AREA
       ========================================================================== */
    .hero-center {
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 10px 0;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.22), rgba(234, 88, 12, 0.22));
      border: 1px solid rgba(245, 158, 11, 0.45);
      box-shadow: 0 0 22px rgba(245, 158, 11, 0.3), inset 0 1px 0 rgba(255, 255, 255, 0.2);
      margin-bottom: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .brand-logo-wrap svg {
      width: 22px;
      height: 22px;
      fill: var(--accent-amber);
    }

    .brand-subtitle-top {
      font-size: clamp(0.68rem, 1.4vw, 0.8rem);
      font-weight: 700;
      letter-spacing: 0.28em;
      color: var(--accent-amber);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .brand-title {
      font-family: 'Rozha One', 'Tiro Devanagari Hindi', serif;
      font-size: clamp(3.5rem, 11vw, 7.5rem);
      font-weight: 400;
      letter-spacing: 0.06em;
      line-height: 0.95;
      background: linear-gradient(180deg, #ffffff 40%, #e2e8f0 70%, #94a3b8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 12px 35px rgba(0,0,0,0.6);
      margin-bottom: 12px;
    }

    .tagline-hindi {
      font-family: 'Tiro Devanagari Hindi', serif;
      font-size: clamp(1.1rem, 2.8vw, 1.6rem);
      color: #fcd34d;
      font-weight: 400;
      margin-bottom: 18px;
      text-shadow: 0 2px 12px rgba(245, 158, 11, 0.25);
      transition: opacity 0.4s ease, transform 0.4s ease;
      min-height: 1.8em;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* FLOATING STATUS PILL */
    .floating-pill {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 6px 18px;
      background: rgba(255, 255, 255, 0.07);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 30px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      font-family: 'Tiro Devanagari Hindi', sans-serif;
      font-size: 0.88rem;
      color: rgba(255, 255, 255, 0.95);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .sound-bars {
      display: inline-flex;
      align-items: flex-end;
      gap: 3px;
      height: 12px;
    }

    .sound-bar {
      width: 2.5px;
      height: 100%;
      background-color: var(--accent-amber);
      border-radius: 2px;
      transform-origin: bottom;
      transform: scaleY(0.3);
      transition: transform 0.2s ease;
    }

    .playing .sound-bar:nth-child(1) { animation: wave 0.8s infinite alternate ease-in-out; }
    .playing .sound-bar:nth-child(2) { animation: wave 0.8s 0.2s infinite alternate ease-in-out; }
    .playing .sound-bar:nth-child(3) { animation: wave 0.8s 0.4s infinite alternate ease-in-out; }

    @keyframes wave {
      0% { transform: scaleY(0.25); }
      100% { transform: scaleY(1); }
    }

    /* VIEWPORT FOOTER CONTACT */
    .viewport-footer {
      font-family: 'Space Mono', monospace;
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
      text-align: center;
    }

    /* ==========================================================================
       MODAL PANELS (PLAYLISTS & ALL SONGS OVERLAYS)
       ========================================================================== */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 5, 4, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      z-index: 1200;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-card {
      background: rgba(18, 12, 9, 0.95);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      width: 100%;
      max-width: 680px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      overflow: hidden;
    }

    .modal-header {
      padding: 18px 24px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .modal-title-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .modal-title {
      font-size: 0.9rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      color: var(--accent-amber);
      text-transform: uppercase;
    }

    .modal-close-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.2rem;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 50%;
      transition: color 0.2s ease;
    }

    .modal-close-btn:hover {
      color: #ffffff;
    }

    .modal-body-list {
      padding: 16px 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }

    .modal-body-list::-webkit-scrollbar {
      width: 5px;
    }
    .modal-body-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    /* Playlist Card Item inside Modal */
    .playlist-card-row {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .playlist-card-row:hover {
      background: rgba(245, 158, 11, 0.1);
      border-color: rgba(245, 158, 11, 0.3);
    }

    .playlist-card-row.active-playing {
      border-color: var(--accent-amber);
      background: rgba(245, 158, 11, 0.15);
    }

    .pl-row-left {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .pl-row-name {
      font-size: 0.92rem;
      font-weight: 600;
      color: #ffffff;
    }

    .pl-row-count {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .pl-row-play-badge {
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--accent-amber);
    }

    /* Song Row Item inside Modal */
    .song-row-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      gap: 12px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .song-row-item:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.12);
    }

    .song-row-item.active-track {
      border-color: rgba(245, 158, 11, 0.4);
      background: rgba(245, 158, 11, 0.1);
    }

    .song-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .song-item-num {
      font-family: 'Space Mono', monospace;
      font-size: 0.75rem;
      color: var(--text-muted);
      width: 24px;
      flex-shrink: 0;
    }

    .song-item-thumb {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      object-fit: cover;
      background: #20140d;
      flex-shrink: 0;
    }

    .song-item-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .song-item-title {
      font-size: 0.86rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .song-item-artist {
      font-size: 0.74rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ==========================================================================
       DYNAMIC QUEUE DRAWER PANEL
       ========================================================================== */
    .queue-panel {
      position: fixed;
      bottom: calc(var(--player-height) + 24px);
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: calc(100% - 32px);
      max-width: 680px;
      height: 380px;
      max-height: 60vh;
      background: rgba(14, 9, 6, 0.94);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 18px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.9);
      z-index: 999;
      display: flex;
      flex-direction: column;
      gap: 12px;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .queue-panel.open {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    /* ==========================================================================
       FIXED BOTTOM GLASS MUSIC PLAYER (CLEAN ALIGNMENT & ICON-ONLY QUEUE)
       ========================================================================== */
    .player-fixed-container {
      position: fixed;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 32px);
      max-width: 680px;
      z-index: 1000;
      pointer-events: none;
    }

    .player-card {
      pointer-events: auto;
      background: var(--glass-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 12px 18px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.12);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .player-top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .track-meta-group {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }

    .album-art-wrap {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      overflow: hidden;
      flex-shrink: 0;
      background: #1c130e;
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
    }

    .album-art-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .album-art-fallback {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #7c2d12, #451a03);
      color: var(--accent-amber);
    }

    .track-text-info {
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .track-title {
      font-size: 0.92rem;
      font-weight: 600;
      color: #ffffff;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .track-artist {
      font-size: 0.76rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .platform-links {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }

    .platform-icon-btn {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .platform-icon-btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #ff0000;
      transform: translateY(-1px);
    }

    .platform-icon-btn svg {
      width: 16px;
      height: 16px;
      fill: currentColor;
    }

    .progress-wrapper {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      display: flex;
      align-items: center;
      cursor: pointer;
    }

    .progress-bar-bg {
      width: 100%;
      height: 4px;
      background: rgba(255, 255, 255, 0.12);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      width: 0%;

    // ==========================================================================
    // 2. WEATHER PARTICLES CANVAS ENGINE
    // ==========================================================================
    function initWeatherCanvas() {
      const canvas = document.getElementById('weather-canvas');
      if (!canvas) return;
      const ctx = canvas.getContext('2d');

      let width = (canvas.width = window.innerWidth);
      let height = (canvas.height = window.innerHeight);

      window.addEventListener('resize', () => {
        width = canvas.width = window.innerWidth;
        height = canvas.height = window.innerHeight;
      });

      const rainDrops = Array.from({ length: 110 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        length: Math.random() * 20 + 10,
        speed: Math.random() * 8 + 6
      }));

      const cloudParticles = Array.from({ length: 22 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height * 0.5,
        radius: Math.random() * 80 + 40,
        speed: Math.random() * 0.4 + 0.1,
        opacity: Math.random() * 0.08 + 0.02
      }));

      const sunParticles = Array.from({ length: 28 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 3 + 1,
        speedY: Math.random() * -0.5 - 0.2,
        opacity: Math.random() * 0.5 + 0.2
      }));

      function render() {
        ctx.clearRect(0, 0, width, height);

        if (weatherMode === 'rainy') {
          ctx.strokeStyle = 'rgba(186, 230, 253, 0.4)';
          ctx.lineWidth = 1.2;
          ctx.lineCap = 'round';

          for (let d of rainDrops) {
            ctx.beginPath();
            ctx.moveTo(d.x, d.y);
            ctx.lineTo(d.x - 2, d.y + d.length);
            ctx.stroke();

            d.y += d.speed;
            d.x -= 0.5;

            if (d.y > height) {
              d.y = -d.length;
              d.x = Math.random() * width;
            }
          }
        } else if (weatherMode === 'cloudy') {
          for (let c of cloudParticles) {
            ctx.beginPath();
            let grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, c.radius);
            grad.addColorStop(0, `rgba(255, 255, 255, ${c.opacity})`);
            grad.addColorStop(1, 'rgba(255, 255, 255, 0)');
            ctx.fillStyle = grad;
            ctx.arc(c.x, c.y, c.radius, 0, Math.PI * 2);
            ctx.fill();

            c.x += c.speed;
            if (c.x - c.radius > width) c.x = -c.radius;
          }
        } else if (weatherMode === 'clear') {
          for (let s of sunParticles) {
            ctx.beginPath();
            ctx.fillStyle = `rgba(253, 224, 71, ${s.opacity})`;
            ctx.arc(s.x, s.y, s.radius, 0, Math.PI * 2);
            ctx.fill();

            s.y += s.speedY;
            if (s.y < 0) {
              s.y = height;
              s.x = Math.random() * width;
            }
          }
        }

        requestAnimationFrame(render);
      }

      render();
    }

    function setWeatherMode(mode) {
      weatherMode = mode;
      document.querySelectorAll('.weather-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.weather === mode);
      });
    }

    document.querySelectorAll('.weather-btn').forEach(btn => {

    });

    // ==========================================================================
    // 4. CATEGORY SWITCHING & RECREATION ENGINE
    // ==========================================================================
    function updateCategoryUI(catKey) {
      if (!MUSIC_CONFIG[catKey]) return;
      const conf = MUSIC_CONFIG[catKey];

      document.querySelectorAll('.cat-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === catKey);
      });

      brandTitle.textContent = conf.title;

      ytPlaylistLink.href = conf.playlistUrl;
      changeRandomBackground();
      startDialogueRotation();
    }

    function switchCategory(catKey) {
      if (!MUSIC_CONFIG[catKey]) return;

      currentCategory = catKey;
      localStorage.setItem('arkesta_active_category', catKey);
      window.location.hash = catKey;

      stopProgressLoop();
      currentVideoId = "";

      activeQueue = [];
      currentTrackIndex = -1;
      activePlaylistKey = "";
      renderQueueUI();

      const conf = MUSIC_CONFIG[catKey];
      updateCategoryUI(catKey);

      trackTitle.textContent = `Loading ${conf.name} Playlist...`;

      recreateYtPlayer(conf.playlistId);
    }

    function recreateYtPlayer(playlistId) {
      stopProgressLoop();

      if (ytPlayer && typeof ytPlayer.destroy === 'function') {
        try { ytPlayer.destroy(); } catch(e) {}
      }

      document.getElementById('yt-hidden-container').innerHTML = '<div id="yt-player"></div>';

      const randomIndex = Math.floor(Math.random() * 15);

      ytPlayer = new YT.Player('yt-player', {
        height: '100',
        width: '100',
        playerVars: {
          'listType': 'playlist',
          'list': playlistId,
          'index': randomIndex,
          'autoplay': 1,
          'controls': 0,
          'disablekb': 1,
          'rel': 0,
          'modestbranding': 1,
          'playsinline': 1
        },
        events: {
          'onReady': onYtReady,
          'onStateChange': onYtStateChange,
          'onError': onYtError
        }
      });

    function changeRandomBackground() {
      const bgPool = MUSIC_CONFIG[currentCategory].backgrounds;
      let newIndex = Math.floor(Math.random() * bgPool.length);
      if (bgPool.length > 1 && newIndex === lastBgIndex) {
        newIndex = (newIndex + 1) % bgPool.length;
      }
      lastBgIndex = newIndex;
      bgVisual.style.backgroundImage = `url('${bgPool[newIndex]}')`;
    }

    // ==========================================================================
    // 6. DYNAMIC QUEUE GENERATOR
    // ==========================================================================
    function syncQueueFromYtPlayer() {
      if (!ytPlayer || typeof ytPlayer.getPlaylist !== 'function') return;

      try {
        const videoIds = ytPlayer.getPlaylist();
        if (Array.isArray(videoIds) && videoIds.length > 0) {
          const playlistKey = videoIds.join(',');

          if (activePlaylistKey !== playlistKey || activeQueue.length === 0) {
            activePlaylistKey = playlistKey;
            
            activeQueue = videoIds.map((vId, idx) => ({
              index: idx,
              videoId: vId,
              title: `Song #${idx + 1}`,
              artist: `${MUSIC_CONFIG[currentCategory].name} Playlist`,
              artwork: `https://img.youtube.com/vi/${vId}/hqdefault.jpg`
            }));

            if (isShuffle) {
              shuffleQueueList();
            } else {
              renderQueueUI();
            }
          }
        }
      } catch (err) {
        console.log("Could not sync queue:", err);
      }
    }

    function shuffleQueueList() {
      if (activeQueue.length <= 1) {
        renderQueueUI();
        return;
      }

      for (let i = activeQueue.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [activeQueue[i], activeQueue[j]] = [activeQueue[j], activeQueue[i]];
      }
      renderQueueUI();
    }

    function renderQueueUI() {
      queueListContainer.innerHTML = '';
      queueCountBadge.textContent = `${activeQueue.length} songs`;

      if (activeQueue.length === 0) {
        queueListContainer.innerHTML = `<div style="text-align:center; color: rgba(255,255,255,0.4); font-size:0.8rem; padding: 20px 0;">Importing ${MUSIC_CONFIG[currentCategory].name} playlist...</div>`;
        return;
      }

      activeQueue.forEach((item, idx) => {
        const isCurrent = (item.index === currentTrackIndex);
        const itemEl = document.createElement('div');
        itemEl.className = `queue-item ${isCurrent ? 'active-track' : ''}`;

        itemEl.onclick = () => {
          playQueueItem(item, idx);
          if (window.innerWidth <= 480) {
            queuePanel.classList.remove('open');
          }
        };

        itemEl.innerHTML = `
          <div class="queue-item-left">
            <span class="queue-num">${idx + 1}</span>
            <img class="item-art-thumb" src="${item.artwork}" alt="Art" onerror="this.style.opacity=0.2;">
            <div class="queue-item-details">
              <div class="queue-item-name">
                ${escapeHtml(item.title)}
                ${isCurrent && isPlaying ? `<span class="playing-indicator">● PLAYING</span>` : ''}
              </div>
              <span class="queue-item-artist">${escapeHtml(item.artist)}</span>
            </div>
          </div>
        `;
        queueListContainer.appendChild(itemEl);
      });
    }

    function playQueueItem(item, queueIdx) {
      if (!ytPlayer) return;

      currentTrackIndex = item.index;

      if (typeof ytPlayer.playVideoAt === 'function') {
        ytPlayer.playVideoAt(item.index);
      } else if (typeof ytPlayer.cueVideoById === 'function') {
        ytPlayer.cueVideoById(item.videoId);
        ytPlayer.playVideo();
      }

      trackTitle.textContent = item.title;
      trackArtist.textContent = item.artist;
      if (item.artwork) {
        albumArt.src = item.artwork;
        albumArt.style.display = 'block';
        albumArtFallback.style.display = 'none';
      }

      renderQueueUI();
    }

    function toggleQueuePanel() {
      queuePanel.classList.toggle('open');
      syncQueueFromYtPlayer();
    }

    // ==========================================================================
    // 7. CLOCK, DATE & REALTIME PRESENCE (3-SECOND TICKER)
    // ==========================================================================
    function updateClockAndDate() {
      const now = new Date();
      
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'pm' : 'am';
      hours = hours % 12 || 12;
      clockDisplay.textContent = `${hours}:${minutes} ${ampm}`;

      const days = ['SUNDAY', 'MONDAY', 'TUESDAY', 'WEDNESDAY', 'THURSDAY', 'FRIDAY', 'SATURDAY'];
      const months = ['JANUARY', 'FEBRUARY', 'MARCH', 'APRIL', 'MAY', 'JUNE', 'JULY', 'AUGUST', 'SEPTEMBER', 'OCTOBER', 'NOVEMBER', 'DECEMBER'];
      
      const dayName = days[now.getDay()];
      const dateNum = now.getDate();
      const monthName = months[now.getMonth()];

      clockDateDisplay.textContent = `${dayName}, ${dateNum} ${monthName} • IST`;
    }

    setInterval(updateClockAndDate, 1000);
    updateClockAndDate();

    let liveTunedIn = 104500 + Math.floor(Math.random() * 2000);

    function updateLiveCounter() {
      const delta = (Math.floor(Math.random() * 3) + 2) * (Math.random() > 0.48 ? 1 : -1);
      liveTunedIn += delta;

      if (liveTunedIn < 101000) liveTunedIn = 102500;
      if (liveTunedIn > 112000) liveTunedIn = 109800;

      const formatted = liveTunedIn.toLocaleString('en-IN');
      onlineCountText.textContent = `${formatted} tuned in`;
    }

    updateLiveCounter();
    setInterval(updateLiveCounter, 3000);

    if ('serviceWorker' in navigator) {
      const swCode = `
        const CACHE_NAME = 'arkesta-eco-v21';
        self.addEventListener('install', (e) => {
          e.waitUntil(caches.open(CACHE_NAME).then((cache) => cache.addAll(['./'])));
        });
        self.addEventListener('fetch', (e) => {
          e.respondWith(caches.match(e.request).then((res) => res || fetch(e.request)));
        });
      `;
      const swBlob = new Blob([swCode], { type: 'text/javascript' });
      const swURL = URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swURL).catch(err => console.log('SW Error:', err));
    }

    let deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredPrompt = e;
      if (installBtn) installBtn.style.display = 'inline-flex';
    });

    if (installBtn) {
      installBtn.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();

        if (outcome === 'accepted') installBtn.style.display = 'none';
        deferredPrompt = null;
      });

    // ==========================================================================
    // 9. YOUTUBE IFRAME PLAYER API INTEGRATION
    // ==========================================================================
    const ytScript = document.createElement('script');
    ytScript.src = "https://www.youtube.com/iframe_api";
    document.head.appendChild(ytScript);

    window.onYouTubeIframeAPIReady = function() {
      recreateYtPlayer(MUSIC_CONFIG[currentCategory].playlistId);
    };

    function onYtReady() {
      isYtReady = true;

      if (ytPlayer.setShuffle) {
        ytPlayer.setShuffle(isShuffle);
      }

      const randomIndex = Math.floor(Math.random() * 15);
      try {
        if (ytPlayer.playVideoAt) {
          ytPlayer.playVideoAt(randomIndex);
        } else {
          ytPlayer.playVideo();
        }
      } catch(e) {
        console.log("Autoplay blocked", e);
      }

      syncQueueFromYtPlayer();
    }

    function onYtStateChange(event) {
      switch (event.data) {
        case YT.PlayerState.PLAYING:
          updatePlayingState(true);
          pillStatusText.textContent = "म्यूजिक ऑन है";
          syncQueueFromYtPlayer();
          syncTrackMetaData();
          startProgressLoop();
          break;

        case YT.PlayerState.PAUSED:
          updatePlayingState(false);
          pillStatusText.textContent = "पॉज़्ड है (Paused)";
          stopProgressLoop();
          break;

        case YT.PlayerState.BUFFERING:
          pillStatusText.textContent = "LOADING...";
          syncQueueFromYtPlayer();
          break;

        case YT.PlayerState.ENDED:
          updatePlayingState(false);
          if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
          break;
      }
    }

    function onYtError(e) {
      console.warn("YouTube API error:", e.data);
      if (ytPlayer && ytPlayer.nextVideo) ytPlayer.nextVideo();
    }

    // ==========================================================================
    // 10. PLAYER CONTROLS & METADATA SYNC
    // ==========================================================================
    function togglePlay() {
      if (!isYtReady || !ytPlayer) return;
      if (isPlaying) {
        ytPlayer.pauseVideo();
      } else {
        ytPlayer.playVideo();
      }
    }

    function updatePlayingState(playing) {
      isPlaying = playing;
      if (playing) {
        playBtnIcon.innerHTML = `<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>`;
        soundBars.classList.add('playing');
      } else {
        playBtnIcon.innerHTML = `<path d="M8 5v14l11-7z"/>`;
        soundBars.classList.remove('playing');
      }
    }

    function syncTrackMetaData() {
      if (!ytPlayer || typeof ytPlayer.getVideoData !== 'function') return;
      try {
        const data = ytPlayer.getVideoData();
        const pIndex = ytPlayer.getPlaylistIndex ? ytPlayer.getPlaylistIndex() : -1;

        if (data && data.title) {
          trackTitle.textContent = data.title;
          trackArtist.textContent = data.author || `${MUSIC_CONFIG[currentCategory].name} Session`;
          
          if (data.video_id && data.video_id !== currentVideoId) {
            currentVideoId = data.video_id;
            changeRandomBackground();
          }

          if (data.video_id) {
            albumArt.src = `https://img.youtube.com/vi/${data.video_id}/hqdefault.jpg`;
            albumArt.style.display = 'block';
            albumArtFallback.style.display = 'none';
          }

          if (pIndex >= 0) {
            currentTrackIndex = pIndex;
            const qItem = activeQueue.find(item => item.index === pIndex);
            if (qItem && qItem.title !== data.title) {
              qItem.title = data.title;
              qItem.artist = data.author || qItem.artist;
              renderQueueUI();
            }
          }
        }
      } catch (e) {
        console.log("Could not sync metadata", e);
      }
    }

    function startProgressLoop() {
      stopProgressLoop();
      progressTimer = setInterval(() => {
        if (!ytPlayer || typeof ytPlayer.getCurrentTime !== 'function') return;

        const curr = ytPlayer.getCurrentTime() || 0;
        const dur = ytPlayer.getDuration() || 0;

        timeCurr.textContent = formatTime(curr);
        timeDur.textContent = formatTime(dur);

        if (dur > 0) {
          progressFill.style.width = `${(curr / dur) * 100}%`;
        }

        syncTrackMetaData();
      }, 500);
    }

    function stopProgressLoop() {
      if (progressTimer) clearInterval(progressTimer);
    }

    function formatTime(seconds) {
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return `${m}:${s < 10 ? '0' : ''}${s}`;
    }

    function seekTrack(e) {
      if (!ytPlayer || typeof ytPlayer.getDuration !== 'function') return;

      const rect = progressClick.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const dur = ytPlayer.getDuration();
      if (dur > 0) {
        const targetTime = (clickX / rect.width) * dur;
        ytPlayer.seekTo(targetTime, true);
        progressFill.style.width = `${(clickX / rect.width) * 100}%`;
      }
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    // ==========================================================================
    // 11. EVENT LISTENERS
    // ==========================================================================
    playBtn.addEventListener('click', togglePlay);

    nextBtn.addEventListener('click', () => {
      if (ytPlayer && ytPlayer.nextVideo) {
        ytPlayer.nextVideo();
        changeRandomBackground();
      }
    });

    prevBtn.addEventListener('click', () => {
      if (ytPlayer && ytPlayer.previousVideo) {
        ytPlayer.previousVideo();
        changeRandomBackground();
      }
    });

    shuffleBtn.addEventListener('click', () => {
      isShuffle = !isShuffle;
      shuffleBtn.classList.toggle('active', isShuffle);
      if (ytPlayer && ytPlayer.setShuffle) {
        ytPlayer.setShuffle(isShuffle);
      }
      shuffleQueueList();
    });

    shuffleQueueBtn.addEventListener('click', () => {
      if (ytPlayer && ytPlayer.setShuffle) {
        ytPlayer.setShuffle(true);
      }
      shuffleQueueList();
    });

    toggleQueueBtn.addEventListener('click', toggleQueuePanel);

    progressClick.addEventListener('click', seekTrack);

    // Keyboard Spacebar play/pause
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        const activeTag = document.activeElement.tagName.toLowerCase();
        if (activeTag !== 'input' && activeTag !== 'textarea') {
          e.preventDefault();
          togglePlay();
        }
      }
    });

    // Initial Setup
    updateCategoryUI(currentCategory);
  </script>
</body>
</html>
